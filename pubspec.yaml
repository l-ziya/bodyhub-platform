name: bodyhub_student
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.2.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/body_hub_logo.png

flutter_launcher_icons:
  android: true
  web:
    generate: true
    image_path: assets/images/body_hub_logo.png
    background_color: '#082A46'
    theme_color: '#082A46'
  image_path: assets/images/body_hub_logo.png
  adaptive_icon_background: '#082A46'
  adaptive_icon_foreground: assets/images/body_hub_logo.png

flutter_native_splash:
  color: '#FFFFFF'
  image: assets/images/body_hub_logo.png
  android: true
  android_12:
    color: '#FFFFFF'
    image: assets/images/body_hub_logo.png
    icon_background_color: '#FFFFFF'
